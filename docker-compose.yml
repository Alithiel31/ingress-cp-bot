services:
  checkpoint-bot:
    build: .
    container_name: telegram_ingress_bot
    restart: unless-stopped
    labels:
      - "homelab.tier=app"
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
